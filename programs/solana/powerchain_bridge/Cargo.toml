[package]
name = "powerchain_bridge"
version = "1.0.0"
description = "PowerChain auxiliary NTT intent guard; Wormhole NTT remains the principal bridge protocol."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "powerchain_bridge"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
