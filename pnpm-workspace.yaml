packages:
  - "apps/*"
  - "packages/*"
  - "shared/blockchain"
  - "clusters"
  - "api"
  - "api/*"

# Canonical monorepo linking. First-party packages must resolve locally.
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: true
sharedWorkspaceLockfile: true

# Workspace integrity / deterministic recursive operations.
recursiveInstall: true
disallowWorkspaceCycles: true
failIfNoMatch: true
engineStrict: true

# Dependency graph / peer consistency.
strictPeerDependencies: true
dedupePeerDependents: true
resolvePeersFromWorkspaceRoot: true
dedupeDirectDeps: true
hoistWorkspacePackages: true

# Store / repeat-install integrity and performance.
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
preferFrozenLockfile: true
optimisticRepeatInstall: true

# Injected workspace packages are intentionally not enabled. The workspace
# exports live TypeScript sources and uses symlinked workspace packages.
dedupeInjectedDeps: true

# Dependency lifecycle scripts are allowlisted only.
strictDepBuilds: true
allowBuilds:
  # Source-controlled equivalent of interactive `pnpm approve-builds`.
  # Add packages only after reviewing why their install lifecycle script is required.
  bigint-buffer: true
  bufferutil: true
  utf-8-validate: true
  # Prisma and common native/JS bundler dependencies required by production installs.
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
